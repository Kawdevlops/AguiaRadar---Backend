version: "3.8"
services:
  mongodb:
    image: mongo:7
    container_name: aguiaradar-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: .
    container_name: aguiaradar-backend
    restart: unless-stopped
    depends_on:
      - mongodb
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/aguiaradar
      JWT_SECRET: c3VwZXItc2VjcmV0LWtleS1hZ3VpYS1yYWRhci1kZXNhZmlvLWZpYXAtMjAyNi1jaGF2ZS1zZWd1cmE=
      IA_ENABLED: "true"
      IA_API_KEY: ""
      IA_PROVIDER_URL: "https://openrouter.ai/api/v1/chat/completions"
      IA_MODEL: "meta-llama/llama-3.1-8b-instruct:free"

volumes:
  mongo_data:
